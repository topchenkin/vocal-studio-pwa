# Production is Timeweb Cloud Apps (https://www.uniquevocal.ru).
# This workflow only typechecks and builds. It must NOT upload a Pages
# artifact or call actions/deploy-pages — a green Pages deploy used to
# look like the live site was down, and a leftover www CNAME to github.io
# sent Russia users to blocked GitHub IPs instead of Timeweb.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Typecheck
        run: npm run typecheck

      - name: Guard against Pages CNAME
        run: |
          if [ -f public/CNAME ] || [ -f out/CNAME ]; then
            echo "public/CNAME and out/CNAME must stay deleted."
            echo "A CNAME file makes GitHub Pages claim www.uniquevocal.ru."
            exit 1
          fi
